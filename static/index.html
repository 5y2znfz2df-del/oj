<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>比特 OJ - 在线评测系统</title>
  <link rel="stylesheet" href="/css/style.css">
  <!-- Monaco Editor（CDN 加载） -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.43.0/min/vs/loader.js"></script>
</head>
<body>

  <!-- 顶部导航 -->
  <nav class="navbar">
    <div class="nav-inner">
      <a class="brand" href="#/problems">🤖 比特 OJ</a>
      <div class="nav-links">
        <a href="#/problems" data-nav="problems">题库</a>
        <a href="#/submissions" data-nav="submissions">提单</a>
        <a href="#/rank" data-nav="rank">排行榜</a>
        <a href="#/trainings" data-nav="trainings">训练</a>
        <a href="#/announcements" data-nav="announcements">公告</a>
        <a href="#/classes" data-nav="classes">班级</a>
        <a href="#/files" data-nav="files">📁 网盘</a>
        <a href="#/shop" data-nav="shop">商城</a>
        <a href="#/admin" data-nav="admin" id="nav-admin" style="display:none">管理后台</a>
      </div>
      <div class="nav-user" id="nav-user">
        <!-- 未登录：登录/注册按钮；登录后：用户名+积分+退出 -->
      </div>
    </div>
  </nav>

  <!-- 页面容器（SPA） -->
  <main id="page" class="container"></main>

  <footer class="footer">
    比特 OJ · 爸爸的玩具 · 有问题戳管理员
  </footer>

  <!-- ============ 登录 / 注册 模态框 ============ -->
  <div id="auth-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login" onclick="switchAuthTab('login')">登 录</button>
          <button class="auth-tab" data-tab="register" onclick="switchAuthTab('register')">注 册</button>
        </div>
        <button class="modal-close" onclick="closeAuthModal()">×</button>
      </div>
      <form id="auth-form" onsubmit="return handleAuthSubmit(event)">
        <input id="auth-username" type="text" placeholder="用户名（3-32 字符）" autocomplete="username" required>
        <input id="auth-password" type="password" placeholder="密码（6-64 字符）" autocomplete="current-password" required>
        <div id="auth-error" class="auth-error"></div>
        <button type="submit" class="btn btn-primary btn-block" id="auth-submit-btn">登 录</button>
      </form>
    </div>
  </div>

  <!-- 通用确认模态框 -->
  <div id="confirm-modal" class="modal hidden">
    <div class="modal-box modal-small">
      <p id="confirm-text"></p>
      <div class="modal-actions">
        <button class="btn" onclick="closeConfirmModal()">取消</button>
        <button class="btn btn-danger" id="confirm-ok">确定</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/modal.js"></script>
  <script src="/js/editor.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
